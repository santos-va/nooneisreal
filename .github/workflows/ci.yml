name: ci

on:
  push:
    branches: ["**"]
  pull_request:

env:
  GODOT_VERSION: "4.7-stable"

jobs:
  gates:
    name: docs & roles gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run gates (wikilinks, asset registry, role parity)
        run: bash tools/gates/run_gates.sh
  godot:
    name: godot smoke + playable regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x Godot_v${GODOT_VERSION}_linux.x86_64
          echo "GODOT_BIN=$PWD/Godot_v${GODOT_VERSION}_linux.x86_64" >> "$GITHUB_ENV"
      - name: make check-playable (import, parse, smoke, presentation regressions)
        run: make check-playable
